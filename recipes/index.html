<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeBook</title>
  <meta name="description" content="RecipeBook: find simple, delicious recipes for every occasion.">

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="RecipeBook">
  <meta property="og:description" content="Find simple, delicious recipes for every occasion.">
  <meta property="og:url" content="https://yourusername.github.io/wdd131/recipes/">
  <meta property="og:image" content="https://yourusername.github.io/wdd131/recipes/images/social-preview-image.png">

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RecipeBook">
  <meta name="twitter:description" content="Find simple, delicious recipes for every occasion.">
  <meta name="twitter:image" content="https://yourusername.github.io/wdd131/recipes/images/social-preview-image.png">

  <!-- Favicon -->
  <link rel="icon" href="images/recipe-book.png">

  <!-- Apple Touch Icon (iOS home screen, 180x180) -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <!-- Amatic SC from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="recipes.css">
</head>
<body>

  <header class="site-header">
    <img src="images/recipe-book.png" alt="RecipeBook logo" class="logo">
    <h1>RecipeBook</h1>
  </header>

  <form class="search" action="#" role="search">
    <input type="search" id="search" name="search" placeholder="Find a recipe" aria-label="Find a recipe">
    <button type="submit" aria-label="Search">
      <img src="images/search.svg" alt="">
    </button>
  </form>

  <main>
    <article class="recipe-card">
      <img src="images/apple-crisp.jpg" alt="Bowl of apple crisp topped with vanilla ice cream" class="recipe-image">

      <div class="recipe-content">
        <span class="tag">dessert</span>
        <h2>Apple Crisp</h2>
        <span
          class="rating"
          role="img"
          aria-label="Rating: 4 out of 5 stars"
        >
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star">⭐</span>
          <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
        <p class="description">
          This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
        </p>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>

    <div class="social">
      <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
      <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
      <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
      <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
    </div>
  </footer>

</body>
</html>
